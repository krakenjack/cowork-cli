<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cowork Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23D97757%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  /* Layout: three quiet columns on an ivory ground; the only strong color is the Claude orange, reserved
     for actions and the working indicator. Serif for names and section titles, sans for everything operated. */
  :root {
    --bg: #F0EEE6;        /* ivory ground */
    --panel: #FAF9F5;     /* raised surface */
    --ink: #141413;
    --ink-2: #3D3D3A;
    --muted: #6E6C64;
    --line: #E2DFD5;
    --line-strong: #CFCBBF;
    --accent: #D97757;    /* Claude orange */
    --accent-hover: #C4643F;
    --accent-ink: #FFFFFF;
    --accent-soft: #F5E4DB;
    --chip: #ECE9E0;
    --drop: #F7F1EA;
    --ok: #3B7A57;
    --warn: #BF3B2E;
    --wait: #9A6F1F;
    --shadow: 0 1px 2px rgba(20, 20, 19, .05), 0 1px 0 rgba(20, 20, 19, .03);
    --font-display: "Lora", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1B1A18; --panel: #242320; --ink: #EDEBE3; --ink-2: #CFCCC2; --muted: #A19E94; --line: #363430; --line-strong: #4A4740;
    --accent: #E0895F; --accent-hover: #EC9C74; --accent-ink: #1B1A18; --accent-soft: #3A2A21; --chip: #2E2C27; --drop: #2A2521;
    --ok: #6FBF90; --warn: #E8705F; --wait: #D9B255; --shadow: 0 1px 2px rgba(0,0,0,.35);
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #1B1A18; --panel: #242320; --ink: #EDEBE3; --ink-2: #CFCCC2; --muted: #A19E94; --line: #363430; --line-strong: #4A4740;
    --accent: #E0895F; --accent-hover: #EC9C74; --accent-ink: #1B1A18; --accent-soft: #3A2A21; --chip: #2E2C27; --drop: #2A2521;
    --ok: #6FBF90; --warn: #E8705F; --wait: #D9B255; --shadow: 0 1px 2px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* header */
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 2; }
  header h1 { font: 500 20px/1.2 var(--font-display); margin: 0; letter-spacing: -.01em; }
  header .path { color: var(--muted); font: 12px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .spacer { flex: 1; }
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
  .dot.live { background: var(--ok); }
  .dot.busy { background: var(--accent); animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }

  /* theme switch */
  .theme { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel); }
  .theme button { border: 0; background: none; color: var(--muted); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; line-height: 1; display: inline-flex; align-items: center; gap: 5px; }
  .theme button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .theme svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* grid */
  main { display: grid; grid-template-columns: minmax(340px, 1.25fr) minmax(300px, 1fr) minmax(300px, 1fr); gap: 16px; padding: 18px 20px 28px; }
  @media (max-width: 1040px) { main { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 700px)  { main { grid-template-columns: 1fr; padding: 14px 16px 24px; } header { padding: 10px 16px; gap: 10px; } header .path { display: none; } }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 16px; min-width: 0; box-shadow: var(--shadow); }
  section h2 { font: 600 15px/1.3 var(--font-display); margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; letter-spacing: -.005em; }
  section h2 .count { font: 500 11px var(--font-body); background: var(--chip); border-radius: 999px; padding: 2px 8px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  section h2 .hint { font: 12px var(--font-body); color: var(--muted); margin-left: auto; font-weight: 400; }

  /* tasks */
  ul { list-style: none; margin: 0; padding: 0; }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 4px; }
  .sub:first-child { margin-top: 0; }
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 7px 6px; border-radius: 8px; }
  .task:hover { background: var(--chip); }
  .task input[type=checkbox] { margin: 4px 0 0; width: 15px; height: 15px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .task .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .task.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .task .meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .task .meta .due.over { color: var(--warn); font-weight: 600; }
  .task .meta .tag::before { content: "#"; opacity: .6; } .task .meta .who::before { content: "@"; opacity: .6; }
  .task .x { opacity: 0; color: var(--muted); border: 0; background: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .task:hover .x, .task .x:focus-visible { opacity: 1; }
  .task .x:hover { color: var(--warn); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text], textarea { flex: 1; min-width: 0; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  input[type=text]:focus, textarea:focus { border-color: var(--line-strong); outline: 2px solid var(--accent-soft); outline-offset: 0; }
  textarea { width: 100%; resize: vertical; min-height: 72px; line-height: 1.45; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* files */
  .drop { display: block; border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 18px 14px; text-align: center; color: var(--muted); background: var(--drop); transition: border-color .15s, background .15s, color .15s; cursor: pointer; margin-bottom: 8px; }
  .drop strong { color: var(--ink-2); font-weight: 500; }
  .drop code { font: 12px var(--font-mono); }
  .drop.over, body.dragging .drop { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .drop input { display: none; }
  .files li { display: flex; gap: 10px; align-items: center; padding: 6px 6px; border-radius: 8px; }
  .files li:hover { background: var(--chip); }
  .files .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files a { text-decoration: none; }
  .files a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  .files .s, .files .d { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* activity */
  .feed li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feed li:last-child { border-bottom: 0; }
  .feed .ts { color: var(--muted); font: 11px/1.6 var(--font-mono); font-variant-numeric: tabular-nums; }
  .feed .k { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 7px; }
  .feed .k.tool { color: var(--accent); } .feed .k.user { color: var(--ok); } .feed .k.inbox { color: var(--wait); }
  .feed .txt { overflow-wrap: anywhere; color: var(--ink-2); }
  .pending { background: var(--accent-soft); border-radius: 8px; padding: 7px 10px; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
  .empty { color: var(--muted); font-size: 13px; padding: 6px; font-style: italic; font-family: var(--font-display); }
  .mem { font-size: 13px; color: var(--muted); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(6px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <span class="state"><span id="dot" class="dot"></span></span>
  <h1 id="name">Cowork Board</h1>
  <span class="path" id="path"></span>
  <span class="spacer"></span>
  <span class="state" id="status">connecting…</span>
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="system" title="Follow system"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Auto</button>
    <button type="button" data-theme-choice="light" title="Day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Day</button>
    <button type="button" data-theme-choice="dark" title="Night"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Night</button>
  </div>
</header>

<main>
  <div class="col">
    <section>
      <h2>Tasks <span class="count" id="taskCount">0</span><span class="hint">edits TASKS.md</span></h2>
      <div id="tasks"></div>
      <form class="row" id="addForm">
        <input type="text" id="addText" placeholder="Add a task… due Friday, #project, @person" autocomplete="off" aria-label="New task">
        <button class="btn" type="submit">Add</button>
      </form>
    </section>
    <section>
      <h2>Message Claude <span class="hint">arrives with the next turn</span></h2>
      <textarea id="msg" placeholder="An instruction, some context, or a nudge. Claude reads it at the start of its next turn." aria-label="Message for Claude"></textarea>
      <div class="row" style="justify-content:flex-end; margin-top:8px">
        <button class="btn" id="send" type="button">Queue message</button>
      </div>
      <div id="pending"></div>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>Inbox <span class="count" id="inboxCount">0</span></h2>
      <label class="drop" id="drop">
        <strong>Drop files here</strong><br>They land in <code>inbox/</code> and Claude sees them on its next turn.
        <input type="file" id="fileInput" multiple>
      </label>
      <ul class="files" id="inbox"></ul>
    </section>
    <section>
      <h2>Outputs <span class="count" id="outCount">0</span></h2>
      <ul class="files" id="outputs"></ul>
    </section>
    <section>
      <h2>Memory</h2>
      <div class="mem" id="memory"></div>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>Activity <span class="hint">live</span></h2>
      <ul class="feed" id="feed"></ul>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tokenParam = new URLSearchParams(location.search).get("token");
  const api = (p) => p + (tokenParam ? (p.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(tokenParam) : "");
  const fmtSize = (n) => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB";
  const fmtAgo = (ms) => { const s = Math.max(0, (Date.now() - ms) / 1000); return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : Math.floor(s / 86400) + "d ago"; };
  const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800); };
  let lastState = null;

  // ----- theme: system | light | dark, remembered per browser -----
  const applyTheme = (choice) => {
    if (choice === "light" || choice === "dark") document.documentElement.dataset.theme = choice; else delete document.documentElement.dataset.theme;
    document.querySelectorAll("[data-theme-choice]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === choice)));
  };
  let themeChoice = "system";
  try { themeChoice = localStorage.getItem("cowork-theme") || "system"; } catch {}
  applyTheme(themeChoice);
  document.querySelectorAll("[data-theme-choice]").forEach((b) => b.addEventListener("click", () => {
    themeChoice = b.dataset.themeChoice; applyTheme(themeChoice);
    try { localStorage.setItem("cowork-theme", themeChoice); } catch {}
  }));

  async function load() {
    try {
      const r = await fetch(api("/api/state"), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch (e) { $("status").textContent = "board server unreachable"; $("dot").className = "dot"; }
  }

  function render(s) {
    lastState = s;
    document.title = s.name + " · Cowork Board";
    $("name").textContent = s.name;
    $("path").textContent = s.workspace;
    const busy = s.session && s.session.state === "working";
    $("dot").className = "dot " + (busy ? "busy" : "live");
    $("status").textContent = busy ? "Claude is working" + (s.session.tool ? " · " + s.session.tool : "") : (s.session && s.session.updated ? "Idle · " + fmtAgo(Date.parse(s.session.updated)) : "Idle");

    // tasks
    const open = s.tasks.filter((t) => !t.done);
    $("taskCount").textContent = open.length;
    const groups = {};
    for (const t of s.tasks) (groups[t.section || "Active"] ||= []).push(t);
    const order = ["Active", "Waiting", ...Object.keys(groups).filter((k) => !["Active", "Waiting", "Done"].includes(k)), "Done"];
    let html = "";
    for (const g of order) {
      const items = groups[g]; if (!items || !items.length) continue;
      const sorted = g === "Done" ? items.slice(-8).reverse() : items.slice().sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
      html += `<div class="sub">${esc(g)}${g === "Done" && items.length > 8 ? ` · last 8 of ${items.length}` : ""}</div><ul>`;
      for (const t of sorted) {
        const text = esc(t.text.replace(/\s*—\s*due\s+\d{4}-\d{2}-\d{2}/i, "").replace(/\s*—\s*\d{4}-\d{2}-\d{2}\s*$/, "").replace(/(^|\s)[#@][\w-]+/g, "").replace(/\s*—\s*$/, "").replace(/\s{2,}/g, " ").trim());
        html += `<li class="task ${t.done ? "done" : ""}" data-id="${t.id}">
          <input type="checkbox" ${t.done ? "checked" : ""} aria-label="${t.done ? "Reopen" : "Mark done"}">
          <div class="t"><div>${text}</div><div class="meta">${t.due ? `<span class="due ${t.overdue ? "over" : ""}">${t.overdue ? "Overdue " : "Due "}${t.due}</span>` : ""}${t.tags.map((x) => `<span class="tag">${esc(x)}</span>`).join("")}${t.people.map((x) => `<span class="who">${esc(x)}</span>`).join("")}</div></div>
          <button class="x" type="button" title="Delete" aria-label="Delete task">×</button></li>`;
      }
      html += "</ul>";
    }
    $("tasks").innerHTML = html || `<div class="empty">No tasks yet. Add one below or ask Claude.</div>`;

    // files
    const fileList = (arr, el, countEl, emptyText) => {
      $(countEl).textContent = arr.length;
      $(el).innerHTML = arr.length ? arr.map((f) => `<li><span class="n">${f.dir ? "▸ " : ""}<a href="${api("/api/file?path=" + encodeURIComponent(f.rel))}" target="_blank" rel="noopener">${esc(f.name)}</a></span><span class="s">${f.dir ? "" : fmtSize(f.size)}</span><span class="d">${fmtAgo(f.mtime)}</span></li>`).join("") : `<li class="empty">${emptyText}</li>`;
    };
    fileList(s.inbox, "inbox", "inboxCount", "Nothing waiting.");
    fileList(s.outputs, "outputs", "outCount", "Nothing delivered yet.");
    $("memory").textContent = s.memory ? `${s.memory.facts} stated facts · MEMORY.md, ${s.memory.lines} lines` : "No memory yet. /remember creates it.";

    // pending messages
    $("pending").innerHTML = s.pending.length ? s.pending.map((p) => `<div class="pending">Queued: ${esc(p.text)}</div>`).join("") : "";

    // activity
    $("feed").innerHTML = s.activity.length ? s.activity.map((a) => {
      const d = new Date(a.ts); const ts = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
      return `<li><span class="ts">${ts}</span><span class="txt"><span class="k ${esc(a.kind)}">${esc(a.kind)}</span>${esc(a.text)}</span></li>`;
    }).join("") : `<li class="empty">Activity appears here as Claude works.</li>`;
  }

  // task actions
  $("tasks").addEventListener("click", async (e) => {
    const li = e.target.closest(".task"); if (!li) return;
    const id = Number(li.dataset.id);
    if (e.target.matches("input[type=checkbox]")) await post("/api/tasks", { action: e.target.checked ? "done" : "reopen", id });
    else if (e.target.matches(".x")) {
      if (li.dataset.confirm) await post("/api/tasks", { action: "delete", id });
      else { li.dataset.confirm = "1"; e.target.textContent = "Delete?"; e.target.style.opacity = 1; setTimeout(() => { delete li.dataset.confirm; e.target.textContent = "×"; e.target.style.opacity = ""; }, 2500); }
    }
  });
  $("addForm").addEventListener("submit", async (e) => { e.preventDefault(); const t = $("addText").value.trim(); if (!t) return; $("addText").value = ""; await post("/api/tasks", { action: "add", text: t }); });
  $("send").addEventListener("click", async () => { const t = $("msg").value.trim(); if (!t) return; $("msg").value = ""; await post("/api/message", { text: t }); toast("Queued for Claude's next turn"); });
  async function post(p, body) {
    const r = await fetch(api(p), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) toast("Error: " + ((await r.json().catch(() => ({}))).error || r.status));
    load();
  }

  // drag and drop (anywhere on the page)
  const drop = $("drop");
  let dragDepth = 0;
  document.addEventListener("dragenter", (e) => { e.preventDefault(); if (++dragDepth === 1) document.body.classList.add("dragging"); });
  document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging"); upload(e.dataTransfer.files); });
  $("fileInput").addEventListener("change", (e) => { upload(e.target.files); e.target.value = ""; });
  async function upload(files) {
    if (!files || !files.length) return;
    const label = drop.firstChild;
    for (const f of files) {
      drop.firstChild.textContent = `Uploading ${f.name}…`;
      const r = await fetch(api("/api/inbox/" + encodeURIComponent(f.name)), { method: "PUT", body: f });
      toast(r.ok ? `Added inbox/${(await r.json()).name}` : `Couldn't upload ${f.name}`);
    }
    drop.firstChild.textContent = "Drop files here";
    load();
  }

  // live updates
  function connect() {
    const es = new EventSource(api("/api/events"));
    es.addEventListener("changed", load);
    es.addEventListener("hello", () => load());
    es.onerror = () => { es.close(); $("status").textContent = "Reconnecting…"; setTimeout(connect, 2000); };
  }
  connect();
  setInterval(() => { if (lastState) render(lastState); }, 30000);
})();
</script>
</body>
</html>
